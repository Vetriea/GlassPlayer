name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21        # AGP 9 requires JDK 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2" # AGP 9.5 requires Gradle 9.x
      - name: Ensure Android platform 37 is installed
        run: yes | sdkmanager "platforms;android-37" > /dev/null 2>&1 || true
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GlassPlayer-apk
          path: app/build/outputs/apk/debug/app-debug.apk
